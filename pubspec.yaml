name: card_vault
description: Secure credit card manager with biometric lock and Google Drive sync
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  local_auth: ^2.3.0
  local_auth_android: ^1.0.36
  sqflite: ^2.3.2
  path: ^1.9.0
  encrypt: ^5.0.3
  crypto: ^3.0.3
  google_sign_in: ^6.2.1
  googleapis: ^13.2.0
  http: ^1.2.1
  provider: ^6.1.2
  intl: ^0.19.0
  flutter_secure_storage: ^9.2.2
  uuid: ^4.4.0
  share_plus: ^12.0.2
  image_picker: ^1.2.4
  google_mlkit_text_recognition: ^0.17.1
  nfc_manager: ^4.2.1
  file_picker: ^11.0.3
  path_provider: ^2.1.6
  device_info_plus: ^12.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/bins.db.gz
    - assets/icons/
